<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Illustration: one brand mark repeated as six regional lock-ups">
  <defs>
    <linearGradient id="orb2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5B8CFF"/><stop offset="1" stop-color="#1D47C9"/></linearGradient>
    <pattern id="dots2" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#CFCFCF"/></pattern>
    <filter id="sh2" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000" flood-opacity="0.12"/></filter>
    <symbol id="mark" viewBox="0 0 40 40"><rect width="40" height="40" rx="11" fill="#0A0A0A"/><path d="M12 28c0-9 6-16 16-16-3 5-3 10 0 16-10 0-16-3-16 0z" fill="#fff"/><circle cx="27" cy="13" r="3.5" fill="#fff"/></symbol>
  </defs>
  <rect width="600" height="400" fill="#E9E9E9"/>
  <rect width="600" height="400" fill="url(#dots2)"/>
  <!-- master mark -->
  <g transform="translate(252 34)" filter="url(#sh2)">
    <rect width="96" height="96" rx="24" fill="#fff"/>
    <use href="#mark" x="20" y="20" width="56" height="56"/>
  </g>
  <text x="300" y="156" text-anchor="middle" font-family="'DM Sans', Satoshi, Arial, sans-serif" font-size="11" font-weight="700" fill="#7C7C7C" letter-spacing="1.8">ONE IDENTITY</text>
  <!-- connectors -->
  <path d="M300 130v24M150 176c70-20 230-20 300 0" fill="none" stroke="#B9B9B9" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round"/>
  <!-- regional tiles -->
  <g font-family="'DM Sans', Satoshi, Arial, sans-serif" font-size="13" font-weight="700" fill="#0A0A0A">
    <g transform="translate(46 196)" filter="url(#sh2)"><rect width="156" height="80" rx="16" fill="#fff"/><use href="#mark" x="18" y="22" width="36" height="36"/><text x="68" y="36" font-size="10" fill="#7C7C7C" letter-spacing="1.4">REGION</text><text x="68" y="56">Africa</text></g>
    <g transform="translate(222 196)" filter="url(#sh2)"><rect width="156" height="80" rx="16" fill="#fff"/><use href="#mark" x="18" y="22" width="36" height="36"/><text x="68" y="36" font-size="10" fill="#7C7C7C" letter-spacing="1.4">REGION</text><text x="68" y="56">MENA</text></g>
    <g transform="translate(398 196)" filter="url(#sh2)"><rect width="156" height="80" rx="16" fill="url(#orb2)"/><rect x="18" y="22" width="36" height="36" rx="10" fill="#fff"/><path d="M28.8 47.2c0-8.1 5.4-14.4 14.4-14.4-2.7 4.5-2.7 9 0 14.4-9 0-14.4-2.7-14.4 0z" fill="#0A0A0A"/><circle cx="42.3" cy="33.7" r="3.2" fill="#0A0A0A"/><text x="68" y="36" font-size="10" fill="#DCE5FF" letter-spacing="1.4">REGION</text><text x="68" y="56" fill="#fff">SE Asia</text></g>
    <g transform="translate(46 292)" filter="url(#sh2)"><rect width="156" height="80" rx="16" fill="#fff"/><use href="#mark" x="18" y="22" width="36" height="36"/><text x="68" y="36" font-size="10" fill="#7C7C7C" letter-spacing="1.4">REGION</text><text x="68" y="56">Europe</text></g>
    <g transform="translate(222 292)" filter="url(#sh2)"><rect width="156" height="80" rx="16" fill="#fff"/><use href="#mark" x="18" y="22" width="36" height="36"/><text x="68" y="36" font-size="10" fill="#7C7C7C" letter-spacing="1.4">REGION</text><text x="68" y="56">LATAM</text></g>
    <g transform="translate(398 292)" filter="url(#sh2)"><rect width="156" height="80" rx="16" fill="#fff"/><use href="#mark" x="18" y="22" width="36" height="36"/><text x="68" y="36" font-size="10" fill="#7C7C7C" letter-spacing="1.4">REGION</text><text x="68" y="56">Vietnam</text></g>
  </g>
</svg>
